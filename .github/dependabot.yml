version: 2

updates:
  - package-ecosystem: maven
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    commit-message:
      prefix: build(deps)
    groups:
      maven-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '05:30'
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci(deps)
    groups:
      github-actions:
        patterns:
          - '*'
