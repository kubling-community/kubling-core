name: Dependency Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read
  security-events: write

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: Audit Maven dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run dependency audit
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [[ -n "$NVD_API_KEY" ]]; then
            ./dependency-audit.sh all --fail-on-cvss 11
          else
            echo '::warning::NVD_API_KEY is not configured; running the update audit without OWASP Dependency-Check.'
            ./dependency-audit.sh updates
          fi

      - name: Upload dependency audit reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: dependency-audit-${{ github.run_id }}
          path: target/dependency-audit
          if-no-files-found: error
          retention-days: 14

      - name: Upload vulnerability results
        if: ${{ always() && hashFiles('target/dependency-audit/**/dependency-check-report.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: target/dependency-audit
          category: owasp-dependency-check
